services:
  backend:
    container_name: cityguide_backend
    build: ./backend
    volumes:
      - ./backend/src/:/app/src
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --request POST --header ''Content-Type: application/json'' --url ''${HEALTHCHECK_BACKEND_URL}'' --data ''{"query":"query { __typename }"}'' || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    environment:
      PORT: ${PORT}
      HEALTHCHECK_BACKEND_URL: ${HEALTHCHECK_BACKEND_URL}
      BASE_URL: ${BASE_URL}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: ${DB_SCHEMA}
      DB_USER: ${DB_USER}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      TOKEN_SECRET_KEY: ${TOKEN_SECRET_KEY}
      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD}
      GATEWAY_PORT: ${GATEWAY_PORT}

  frontend:
    container_name: cityguide_frontend
    build: ./frontend
    volumes:
      - ./frontend/src/:/app/src
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail ${HEALTHCHECK_FRONTEND_URL} || exit 1"]
    environment:
      VITE_BASE_URL: ${VITE_BASE_URL}
      VITE_GATEWAY_PORT: ${GATEWAY_PORT}
      HEALTHCHECK_FRONTEND_URL: ${HEALTHCHECK_FRONTEND_URL}

  test_database:
    container_name: cityguide_test_database
    image: postgres
    environment:
      POSTGRES_PASSWORD: ${DB_TEST_PASSWORD}
      POSTGRES_DB: ${DB_TEST_SCHEMA}
      POSTGRES_USER: ${DB_TEST_USER}
      POSTGRES_HOST: ${DB_TEST_HOST}
    ports:
      - "5434:5432"

  database:
    container_name: cityguide_database
    image: postgres
    volumes:
      - ./persist/data/:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_SCHEMA} -h ${DB_HOST}"]
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 10s
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_SCHEMA}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_HOST: ${DB_HOST}

  vizualizer:
    container_name: cityguide_vizualizer
    image: adminer

  gateway:
    container_name: cityguide_gateway
    image: nginx
    ports:
      - ${GATEWAY_PORT}:80
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf
    depends_on:
      frontend:
        condition: service_healthy
